      - name: Patch status bar spacing (no full screen under system bars)
        script: |
          sed -i 's/\r$//' scripts/*.sh || true
          chmod +x scripts/patch-android-statusbar.sh
          bash scripts/patch-android-statusbar.sh android
      - name: Verify status bar patch
        script: |
          STYLES="android/app/src/main/res/values/styles.xml"
